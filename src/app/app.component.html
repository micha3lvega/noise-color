<div id="container">
  <div class="controls">
    <div class="bottom-controls">
      <button (click)="startMicrophone()" type="button">Iniciar</button>
      <button (click)="stopMicrophone()" type="button">Detener</button>
      <div class="volumen-bar-container">
        <div
          class="volumen-bar"
          [style.width.%]="volumenActual * 100">
        </div>
      </div>
    </div>
  </div>

  <canvas #canvas></canvas>
</div>
